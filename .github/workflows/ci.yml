name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: facture
          POSTGRES_PASSWORD: facture
          POSTGRES_DB: facture
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U facture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Environment
        run: cp .env.example .env
      - run: pnpm --filter @facture/core build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Domain tests
        run: pnpm --filter @facture/core test
      - name: Web unit tests
        run: pnpm --filter web test
      - name: API end-to-end tests
        run: pnpm --filter api test:e2e
      - name: Web build
        run: pnpm --filter web build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
